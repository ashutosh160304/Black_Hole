<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 25px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        .paper {
            background: white;
            padding: 18px 22px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .paper a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .paper a:hover {
            text-decoration: underline;
        }

        .type {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }
    </style>
</head>
